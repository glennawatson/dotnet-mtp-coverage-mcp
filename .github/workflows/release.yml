name: Release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Release increment
        required: true
        type: choice
        options:
        - major
        - minor
        - patch
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    outputs:
      semver2: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      prerelease: ${{ steps.bump.outputs.prerelease }}
      sourceSha: ${{ github.sha }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - name: Setup .NET Environment
      uses: glennawatson/actions-common/.github/actions/dotnet-environment@381282a6137c4f3c099ff80d9ee909e5d262998a
      with:
        stamp-version: false
        dotnet-versions: |
          11.0.x
          10.0.x
    - name: Compute release version
      uses: glennawatson/actions-common/.github/actions/compute-version-and-tag@381282a6137c4f3c099ff80d9ee909e5d262998a
      with:
        bump: ${{ inputs.bump }}
        tag-prefix: ''
        push-tag: false
      id: bump
    - name: Set the release version for NBGV
      run: dotnet run --file .github/scripts/set-release-version.cs
      env:
        RELEASE_VERSION: ${{ steps.bump.outputs.version }}
    - name: Setup NBGV
      uses: dotnet/nbgv@v0.4.2
      id: nbgv
      with:
        setAllVars: true
    - name: Restore
      run: dotnet restore src/UnitTestMcp.slnx -p:Configuration=Release
      shell: bash
    - name: Build
      run: dotnet build src/UnitTestMcp.slnx --no-restore --configuration Release -p:Version="$VERSION" -p:PackageVersion="$VERSION"
      shell: bash
      env:
        VERSION: ${{ steps.bump.outputs.version }}
    - name: Test
      working-directory: src
      run: dotnet test --solution UnitTestMcp.slnx --no-build --configuration Release --no-progress
      shell: bash
    - name: Pack
      run: dotnet pack src/UnitTestMcp.slnx --no-build --configuration Release -p:Version="$VERSION" -p:PackageVersion="$VERSION" -o packages
      shell: bash
      env:
        VERSION: ${{ steps.bump.outputs.version }}
    - name: Sign packages with Certum SimplySign
      uses: glennawatson/actions-common/.github/actions/certum-sign@381282a6137c4f3c099ff80d9ee909e5d262998a
      env:
        CERTUM_USER_ID: ${{ secrets.CERTUM_USER_ID }}
        CERTUM_OTP_URI: ${{ secrets.CERTUM_OTP_URI }}
        CERTUM_CERT_FINGERPRINT: ${{ secrets.CERTUM_CERT_FINGERPRINT }}
      with:
        nuget: 'packages/*.nupkg'
    - name: Upload signed packages
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: signed-nuget
        path: packages/*.nupkg
        if-no-files-found: error
    - name: NuGet login (OIDC trusted publishing)
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
      id: nuget-login
      with:
        user: ${{ secrets.NUGET_USER }}
    - name: Push to NuGet
      run: dotnet nuget push "packages/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
      env:
        NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
      shell: bash
  create-release:
    needs:
    - build
    permissions:
      contents: write
    uses: glennawatson/actions-common/.github/workflows/workflow-common-create-release.yml@381282a6137c4f3c099ff80d9ee909e5d262998a
    with:
      version: ${{ needs.build.outputs.semver2 }}
      tag: ${{ needs.build.outputs.tag }}
      target: ${{ needs.build.outputs.sourceSha }}
      prerelease: ${{ needs.build.outputs.prerelease == 'true' }}
...
