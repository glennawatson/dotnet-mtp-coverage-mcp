name: CI Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup .NET
      uses: glennawatson/actions-common/.github/actions/dotnet-environment@main
      with:
        stamp-version: 'false'
        dotnet-versions: |
          10.0.x
          11.0.x
    - name: Setup NBGV
      uses: dotnet/nbgv@v0.4.2
      with:
        setAllVars: true
    - name: Restore
      run: dotnet restore src/UnitTestMcp.slnx
    - name: Build
      run: dotnet build src/UnitTestMcp.slnx --no-restore --configuration Release
    - name: Test
      run: dotnet test --solution UnitTestMcp.slnx --no-build --configuration Release --no-progress
      working-directory: src
