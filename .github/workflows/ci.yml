name: CI Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup .NET
      uses: glennawatson/actions-common/.github/actions/setup-sdk@main
      with:
        dotnet-version: |
          10.0.x
          11.0.x
    - name: Setup NBGV
      uses: dotnet/nbgv@v0.4.2
      with:
        setAllVars: true
    - name: Restore
      uses: glennawatson/actions-common/.github/actions/run-command@main
      with:
        command: dotnet
        arguments: |-
          restore
          src/UnitTestMcp.slnx
        working-directory: .
    - name: Build
      uses: glennawatson/actions-common/.github/actions/run-command@main
      with:
        command: dotnet
        arguments: |-
          build
          src/UnitTestMcp.slnx
          --no-restore
          --configuration
          Release
        working-directory: .
    - name: Test
      uses: glennawatson/actions-common/.github/actions/run-command@main
      with:
        command: dotnet
        arguments: |-
          test
          --solution
          UnitTestMcp.slnx
          --no-build
          --configuration
          Release
        working-directory: src
